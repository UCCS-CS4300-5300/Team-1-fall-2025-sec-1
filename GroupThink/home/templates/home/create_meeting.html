{% extends 'home/base.html' %}
{% block title %}Create Meeting{% endblock %}

{% block content %}
<main class="hero">
    <div class="hero-inner">
        <h1 class="headline">
        CREATE MEETING
        </h1>
        <form method="POST">
            {% csrf_token %}

            <input type="text" name="title" placeholder="Meeting title" required> <br>
            <button class="btn btn-primary" type="submit">Create</button>
        </form>
    </div>
</main>

{% endblock %}
