{% extends 'home/base.html' %}
{% block title %}Change Password - GroupThink{% endblock %}

{% block content %}
<main class="dashboard-container" style="max-width: 600px; margin: 40px auto;">
  
  <h1 style="margin-bottom: 20px;">Change Your Password</h1>

  <div style="background: white; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}

      <button type="submit"
              style="background:#4a4aef; color:white; padding:10px 16px; border:none; border-radius:6px; font-weight:600;">
        Update Password
      </button>
    </form>
  </div>

</main>
{% endblock %}
