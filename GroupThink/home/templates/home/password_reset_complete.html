{% extends 'home/base.html' %}
{% block title %}Password Reset Complete - GroupThink{% endblock %}

{% block content %}
<main class="auth-container">
  <div class="auth-box">
    <h1 class="auth-title">Password Reset Complete!</h1>
    <p class="auth-subtitle">Your password has been successfully reset. You can now log in with your new password.</p>

    <div style="margin: 24px 0;">
      <a href="{% url 'login' %}" class="btn btn-submit">Go to Login</a>
    </div>
  </div>
</main>
{% endblock %}
