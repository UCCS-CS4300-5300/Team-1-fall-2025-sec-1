{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GroupThink</title>
  <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body>
  <!-- Top Nav -->
  <nav class="nav-wrap">
    <div class="nav">
      <div class="brand">GROUPTHINK</div>
      <ul class="links">
        <li><a href="#">Dashboard</a></li>
        <li><a href="#">My Tasks</a></li>
        <li><a href="#">Meetings</a></li>
      </ul>
      <a class="btn btn-login" href="#">Login</a>
    </div>
  </nav>

  <!-- Hero -->
  <main class="hero">
    <div class="hero-inner">
      <h1 class="headline">
        THINK BETTER <span class="accent">TOGETHER</span>
      </h1>
      <p class="subhead">
        GroupThink is the first collaboration software app for students
      </p>
      <a class="btn btn-primary" href="#">SignUp</a>
    </div>

    <!-- Decorative background circles + bulb -->
    <div class="rings rings-left"></div>
    <div class="rings rings-right"></div>
    <svg class="bulb" viewBox="0 0 128 128" aria-hidden="true">
      <g opacity="0.18">
        <path d="M64 12c-20 0-36 15-36 34 0 12 6 20 12 26 4 4 6 9 6 14h36c0-5 2-10 6-14 6-6 12-14 12-26 0-19-16-34-36-34z" fill="#FFDFA6"/>
        <rect x="48" y="96" width="32" height="10" rx="5" fill="#D0D0D0"/>
        <rect x="46" y="108" width="36" height="6" rx="3" fill="#C4C4C4"/>
      </g>
    </svg>
  </main>
</body>
</html>
